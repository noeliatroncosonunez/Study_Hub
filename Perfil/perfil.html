<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="perfil.css">
    <title>Mi Perfil - Study Hub</title>
</head>
<body>

    <header>
        <section class="logo">
            <h1>📚 Study Hub</h1>
        </section>
    
            <a href="../study_hub.html">Volver al Inicio</a>
        
    </header>

    <main>
        <article class="register-container">
            <h2>Mi Perfil</h2>
            
            <p id="alert-message" class="alert-error" style="display: none;"></p>
            
            <!-- Selector de Rol (Estudiante / Docente) -->
            <section class="input-group">
                <label for="roleSelector">Tipo de Usuario</label>
                <select id="roleSelector" class="profile-select">
                    <option value="estudiante">👨‍🎓 Estudiante</option>
                    <option value="docente">👨‍🏫 Docente</option>
                </select>
                </div>
            </section>

            <form id="profileForm">
                <!-- Campos Estudiante -->
                <div id="fieldsEstudiante">
                    <section class="input-group">
                        <label for="username">Nombre de Usuario</label>
                        <input type="text" id="username" name="username" placeholder="Tu usuario" required>
                    </section>

                    <section class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                    </section>

                    <section class="input-group">
                        <label for="curso">Curso / Nivel</label>
                        <input type="text" id="curso" name="curso" placeholder="Ej: 3° Medio TP">
                    </section>

                    <section class="input-group">
                        <label for="especialidad">Especialidad</label>
                        <input type="text" id="especialidad" name="especialidad" placeholder="Ej: Programación">
                    </section>

                <!-- Campos Docente -->
                <div id="fieldsDocente" style="display: none;">
                    <section class="input-group">
                        <label for="docName">Nombre Completo</label>
                        <input type="text" id="docName" name="docName" placeholder="Nombre del docente">
                    </section>

                    <section class="input-group">
                        <label for="docEmail">Correo Electrónico</label>
                        <input type="email" id="docEmail" name="docEmail" placeholder="correo@ejemplo.com">
                    </section>

                    <section class="input-group">
                        <label for="asignatura">Asignatura / Módulo</label>
                        <input type="text" id="asignatura" name="asignatura" placeholder="Ej: Programación / Desarrollo Web">
                    </section>

                    <section class="input-group">
                        <label for="institucion">Institución Educativa</label>
                        <input type="text" id="institucion" name="institucion" placeholder="Nombre del Liceo o Colegio">
                    </section>
                </div>

                <button type="submit" class="btn-register">💾 Guardar Perfil</button>
            </form>

        </article>
    </main>

    <script src="perfil.js"></script>
</body>
</html>
