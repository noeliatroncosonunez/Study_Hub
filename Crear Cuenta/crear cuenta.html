<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="crear cuenta.css">
    <title>📚Crear Cuenta - Study Hub</title>
</head>
<body>
    <!-- Encabezado de la página -->
    <header class="header-auth">
        <div class="logo">
            <h1>📚 Study Hub</h1>
        </div>
        <nav>
            <a href="../study_hub.html" class="btn-volver-nav">← Volver al Inicio</a>
        </nav>
    </header>

    <!-- Contenedor Principal de Registro -->
    <main class="contenedor-auth">
        <article class="auth-card">
            
            <div class="auth-header">
                <span class="auth-badge">🚀 Únete a la Comunidad</span>
                <h2>Crear Cuenta</h2>
                <p>Regístrate para guardar tu progreso, desbloquear logros y acceder a recursos personalizados.</p>
            </div>

            <!-- Alerta de Error (oculta por defecto) -->
            <div id="error-message" class="alert-error hidden" role="alert"></div>

            <form id="registerForm" class="auth-form">
                
                <!-- Campo: Nombre de Usuario -->
                <div class="input-group">
                    <label for="username">Nombre de Usuario</label>
                    <div class="input-field-wrapper">
                        <span class="field-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Tu usuario" required autocomplete="username">
                    </div>
                </div>

                <!-- Campo: Correo Electrónico -->
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-field-wrapper">
                        <span class="field-icon">📧</span>
                        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required autocomplete="email">
                    </div>
                </div>

                <!-- Campo: Nivel Académico Principal -->
<div class="input-group">
    <label for="nivelAcademico">Nivel Académico</label>
    <div class="input-field-wrapper">
        <span class="field-icon">🎓</span>
        <select id="nivelAcademico" name="nivelAcademico" required onchange="actualizarLetrasCursos()">
            <option value="" disabled selected>Selecciona tu nivel educativo</option>
            <option value="Basica">Educación Básica (1° a 8°)</option>
            <option value="Media">Educación Media (1° a 4° Medio)</option>
            <option value="TP">Especialidad TP (Técnico Profesional)</option>
            <option value="Superior">Educación Superior / Universidad</option>
        </select>
    </div>
</div>

<!-- Campo: Letra / Sección (Aparece o cambia según el nivel) -->
<div class="input-group" id="grupoLetraCurso" style="display: none;">
    <label for="letraCurso">Curso y Sección (Letra)</label>
    <div class="input-field-wrapper">
        <span class="field-icon">🏫</span>
        <select id="letraCurso" name="letraCurso" required>
            <option value="" disabled selected>Selecciona tu curso y letra</option>
            <!-- Las opciones se cargan dinámicamente con JavaScript -->
        </select>
    </div>
</div>

                <!-- Campo: Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-field-wrapper">
                        <span class="field-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" id="togglePassword" class="btn-toggle-password" aria-label="Mostrar contraseña">👁️</button>
                    </div>
                </div>

                <!-- Campo: Confirmar Contraseña -->
                <div class="input-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="input-field-wrapper">
                        <span class="field-icon">🔒</span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <!-- Botón de Registro -->
                <button type="submit" class="btn-submit-auth">Registrarme en Study Hub ➔</button>
            </form>

            <footer class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="../iniciar sesion/iniciar sesion.html">Inicia sesión aquí</a></p>
            </footer>
        </article>
    </main>

    <script src="crear cuenta.js"></script>
</body>
</html>
