<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="iniciar sesion.css">
    <title>Study Hub | Iniciar Sesión</title>
</head>
<body>

    <!-- Encabezado de la página -->
    <header class="header-auth">
        <div class="logo">
            <h1>📚 Study Hub</h1>
        </div>
        <nav>
            <a href="../study_hub.html" class="btn-volver-nav">← Volver al Inicio</a>
        </nav>
    </header>

    <!-- Contenedor Principal de Autenticación -->
    <main class="contenedor-auth">
        <article class="auth-card">
            
            <div class="auth-header">
                <span class="auth-badge">🔑 Acceso a tu Cuenta</span>
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus datos para acceder a tus recursos, cursos y progreso.</p>
            </div>

            <!-- Alerta de Error (oculta por defecto) -->
            <div id="error-message" class="alert-error hidden" role="alert"></div>

            <form id="loginForm" class="auth-form">
                
                <!-- Campo: Usuario / Email -->
                <div class="input-group">
                    <label for="username">Usuario o Correo Electrónico</label>
                    <div class="input-field-wrapper">
                        <span class="field-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Tu usuario o email" required autocomplete="username">
                    </div>
                </div>

                <!-- Campo: Contraseña -->
                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                    </div>
                    <div class="input-field-wrapper">
                        <span class="field-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña">
                            👁️
                        </button>
                    </div>
                </div>

                <!-- Botón de Ingreso -->
                <button type="submit" class="btn-submit-auth">Ingresar a Study Hub ➔</button>
            </form>

            <footer class="auth-footer">
                <p>¿No tienes una cuenta aún? <a href="../Crear Cuenta/crear cuenta.html">Regístrate aquí</a></p>
            </footer>
        </article>
    </main>

    <script src="iniciar_sesion.js"></script>
</body>
</html>
